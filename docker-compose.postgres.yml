services:
  postgres:
    image: postgres:16
    container_name: awaazde-postgres
    environment:
      POSTGRES_USER: awaazde
      POSTGRES_PASSWORD: awaazde
      POSTGRES_DB: awaazde
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      glue-network:
        aliases:
          - postgres
          - test-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awaazde"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  glue-network:
    external: true
    name: glue-network

volumes:
  postgres-data:
