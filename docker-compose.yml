services:
  minio:
    image: minio/minio
    container_name: local-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - minio-data:/data
    networks:
      - glue-network

  trino:
    image: trinodb/trino:390
    container_name: local-trino
    ports:
      - "8080:8080"
    depends_on:
      - minio
      - hive-metastore
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      - warehouse-data:/data/warehouse
    environment:
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_REGION=ap-south-1
    networks:
      - glue-network

  hive-metastore:
    image: apache/hive:3.1.3
    container_name: hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql
      SERVICE_OPTS: "-Xmx1G"
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: ap-south-1
    ports:
      - "9083:9083"
    volumes:
      - ./hive/conf:/opt/hive/conf
      - ./hive/lib/mysql-connector-java-8.0.28.jar:/opt/hive/lib/mysql-connector-java-8.0.28.jar
      - ./hive/lib/hadoop-aws-3.1.0.jar:/opt/hive/lib/hadoop-aws-3.1.0.jar
      - ./hive/lib/aws-java-sdk-bundle-1.11.271.jar:/opt/hive/lib/aws-java-sdk-bundle-1.11.271.jar
    networks:
      - glue-network
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        echo "Waiting 15 seconds for MySQL to be fully ready..."
        sleep 15
        echo "Initializing Hive schema..."
        /opt/hive/bin/schematool -dbType mysql -initSchema || echo "Schema may already exist"
        echo "Starting Hive Metastore..."
        exec /opt/hive/bin/hive --service metastore
    restart: unless-stopped

  hive-server:
    image: apache/hive:3.1.3
    container_name: hive-server
    depends_on:
      - hive-metastore
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: "-Xmx1G"
      IS_RESUME: "true"
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: minio123
      AWS_REGION: ap-south-1
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - ./hive/conf:/opt/hive/conf
      - ./hive/lib/hadoop-aws-3.1.0.jar:/opt/hive/lib/hadoop-aws-3.1.0.jar
      - ./hive/lib/aws-java-sdk-bundle-1.11.271.jar:/opt/hive/lib/aws-java-sdk-bundle-1.11.271.jar
    networks:
      - glue-network
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /tmp/hive && chmod 777 /tmp/hive
        /entrypoint.sh

  metastore-db:
    image: mysql:8.0
    container_name: metastore-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: metastore
      MYSQL_USER: hive
      MYSQL_PASSWORD: hive
    volumes:
      - metastore-data:/var/lib/mysql
    networks:
      - glue-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  glue:
    build:
      context: .
      dockerfile: Dockerfile.glue
    image: custom-aws-glue-libs:5
    container_name: glue-interactive
    ports:
      - "4040:4040"
      - "18080:18080"
    depends_on:
      - minio
      - hive-metastore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./glue-jobs:/home/glue_user/workspace/jobs
      - ./output:/home/glue_user/workspace/output
      - ./glue-config/spark-defaults.conf:/home/glue_user/spark/conf/spark-defaults.conf
      - ./glue-config/hive-site.xml:/home/glue_user/spark/conf/hive-site.xml
      - ./glue-config/jars/postgresql-42.7.1.jar:/usr/lib/spark/jars/postgresql-42.7.1.jar
      - ${REPORTS_PATH}:/home/glue_user/workspace/reports
    environment:
      - DISABLE_SSL=true
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - AWS_REGION=ap-south-1
      - PYTHONPATH=/home/glue_user/workspace/reports:/home/glue_user/aws-glue-libs/PyGlue.zip:/home/glue_user/spark/python/lib/pyspark.zip:/home/glue_user/spark/python/lib/py4j-0.10.9-src.zip
      - DISABLE_GLUE_CATALOG=true
    networks:
      - glue-network
    stdin_open: true
    tty: true
    entrypoint: ["/bin/bash"]

networks:
  glue-network:
    external: true
    name: glue-network

volumes:
  minio-data:
  metastore-data:
  warehouse-data: