spark.driver.extraClassPath     /home/glue_user/spark/jars/*:/home/glue_user/aws-glue-libs/jars/*
spark.executor.extraClassPath   /home/glue_user/spark/jars/*:/home/glue_user/aws-glue-libs/jars/*
spark.eventLog.enabled  true
spark.history.fs.logDirectory   file:////tmp/spark-events

# Memory and executor configuration
spark.driver.memory             4g
spark.executor.memory           4g
spark.sql.shuffle.partitions    10
spark.default.parallelism       10
spark.hadoop.mapreduce.fileoutputcommitter.marksuccessfuljobs   false
spark.unsafe.sorter.spill.read.ahead.enabled    false

# MinIO S3A configuration
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minio
spark.hadoop.fs.s3a.secret.key=minio123
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled=false

# S3A performance and reliability settings
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.fast.upload.buffer=bytebuffer
spark.hadoop.fs.s3a.multipart.size=104857600
spark.hadoop.fs.s3a.connection.maximum=100
spark.hadoop.fs.s3a.threads.max=10
spark.hadoop.fs.s3a.connection.timeout=200000
spark.hadoop.fs.s3a.attempts.maximum=5

# Use FileOutputCommitter v2 (faster, works better with S3)
spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version=2
spark.sql.parquet.output.committer.class=org.apache.parquet.hadoop.ParquetOutputCommitter
spark.sql.sources.commitProtocolClass=org.apache.spark.sql.execution.datasources.SQLHadoopMapReduceCommitProtocol

# Use standalone Hive Metastore (NOT AWS Glue)
spark.sql.catalogImplementation=hive
spark.hadoop.hive.metastore.uris=thrift://hive-metastore:9083
spark.sql.warehouse.dir=s3a://datalake/warehouse

# Hive metastore client config (use path for jars to avoid version conflicts)
spark.sql.hive.metastore.version=2.3.9
spark.sql.hive.metastore.jars=path
spark.sql.hive.metastore.jars.path=/home/glue_user/spark/jars/*

# Timezone configuration
spark.sql.session.timeZone=Asia/Kolkata
