# PostgreSQL configuration for MD5 authentication

# Change password encryption to md5 (default in PG16 is scram-sha-256)
password_encryption = md5

# Connection Settings
listen_addresses = '*'
max_connections = 100

# Memory Settings (adjust as needed for development)
shared_buffers = 128MB
work_mem = 4MB

# Logging (useful for development)
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_statement = 'all'
log_duration = on